services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fiscalflow-app:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: https://app.nfeblao.com.br
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: file
    volumes:
      - laravel_storage:/var/www/html/storage
      - ${NFE_CERTIFICATE_DIR:-./secrets/certificates}:/run/secrets/nfe:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets/ssl-params.conf:/etc/nginx/snippets/ssl-params.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_etc:/etc/letsencrypt:ro
    command: >-
      /bin/sh -c 'nginx -g "daemon off;" &
      while :; do sleep 6h; nginx -s reload; done'
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  certbot:
    image: certbot/certbot:v3.1.0
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    entrypoint: /bin/sh
    command: >-
      -c 'trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done'
    networks:
      - backend

volumes:
  laravel_storage:
  postgres_data:
  certbot_www:
  certbot_etc:

networks:
  backend:
    driver: bridge
