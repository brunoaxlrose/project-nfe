upstream fiscalflow_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.nfeblao.com.br;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.nfeblao.com.br;

    ssl_certificate /etc/letsencrypt/live/app.nfeblao.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.nfeblao.com.br/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://fiscalflow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
    }
}
